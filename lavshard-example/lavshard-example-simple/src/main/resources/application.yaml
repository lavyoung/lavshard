spring:
  application:
    name: lavshard-example-simple

lavshard:
  enabled: true

  integration:
    default-data-source: ds0
    default-transaction-isolation: read-committed
    ordinary-tables:
      - sys_dict
    managed-mapper-packages:
      - io.github.lavyoung.lavshard.example.order.mapper

  data-sources:
    ds0:
      managed:
        url: "jdbc:h2:mem:lavshard_simple;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'"
        username: sa
        password:
        driver-class-name: org.h2.Driver
        maximum-pool-size: 4
        minimum-idle: 0
        connection-timeout: 30000

  defaults:
    layout: single-database-tables

  layouts:
    single-database-tables:
      version: order-layout-v1
      data-source-ids:
        - ds0
      tables-per-data-source: 2
      bucket-count: 2

  tables:
    t_order:
      sharding-column: user_id