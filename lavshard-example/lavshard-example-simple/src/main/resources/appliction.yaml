lavshard:
  integration:
    default-data-source: ds0
    default-transaction-isolation: read-committed
    ordinary-tables:
      - sys_dict
    managed-mapper-packages:
      - com.acme.order.mapper
      - com.acme.billing.mapper.InvoiceMapper
  data-sources:
    ds0:
      bean-name: applicationDataSource
    ds1:
      managed:
        url: jdbc:mysql://localhost:3306/order_1
        username: root
        password: ${DB_1_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000