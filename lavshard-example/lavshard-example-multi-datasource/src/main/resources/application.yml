spring:
  application:
    name: lavshard-example-multi-datasource

lavshard:
  enabled: true

  integration:
    default-data-source: ds0
    default-transaction-isolation: read-committed
    managed-mapper-packages:
      - io.github.lavyoung.lavshard.example.multi.order.mapper

  data-sources:
    ds0:
      managed:
        url: "jdbc:h2:mem:lavshard_multi_0;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'"
        username: sa
        password:
        driver-class-name: org.h2.Driver
        maximum-pool-size: 4
        minimum-idle: 0
        connection-timeout: 30000

    ds1:
      managed:
        url: "jdbc:h2:mem:lavshard_multi_1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'"
        username: sa
        password:
        driver-class-name: org.h2.Driver
        maximum-pool-size: 4
        minimum-idle: 0
        connection-timeout: 30000

  defaults:
    layout: database-only

  layouts:
    database-only:
      version: order-database-layout-v1
      data-source-ids:
        - ds0
        - ds1
      tables-per-data-source: 1
      bucket-count: 2
      table-suffix:
        enabled: false

  tables:
    t_order:
      sharding-column: user_id